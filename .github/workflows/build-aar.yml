name: Build and Publish AAR

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          pip3 install meson --break-system-packages

      - name: Get buildscripts hash
        id: bs-hash
        run: echo "hash=$(git rev-parse HEAD:buildscripts)" >> $GITHUB_OUTPUT

      - name: Cache mpv-android sdk
        id: cache-mpv-sdk
        uses: actions/cache@v4
        with:
          path: |
            buildscripts/sdk/
            buildscripts/prefix/
          key: ${{ runner.os }}-mpv-sdk-${{ steps.bs-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-mpv-sdk-

      - name: Run download.sh
        if: steps.cache-mpv-sdk.outputs.cache-hit != 'true'
        run: |
          cd buildscripts
          ./download.sh

      - name: Build and collect libraries
        run: |
          cd buildscripts
          for arch in arm64 armv7l x86_64 x86; do
            ./buildall.sh --arch $arch mpv
            
            case $arch in
              arm64) jni_arch="arm64-v8a" ;;
              armv7l) jni_arch="armeabi-v7a" ;;
              x86) jni_arch="x86" ;;
              x86_64) jni_arch="x86_64" ;;
            esac
            
            dst="../library/src/main/jniLibs/$jni_arch/"
            mkdir -p "$dst"
            cp prefix/$arch/lib/libmpv.so "$dst" || true
            cp prefix/$arch/lib/libavcodec.so "$dst" || true
            cp prefix/$arch/lib/libavformat.so "$dst" || true
            cp prefix/$arch/lib/libavutil.so "$dst" || true
            cp prefix/$arch/lib/libswscale.so "$dst" || true
            cp prefix/$arch/lib/libswresample.so "$dst" || true
            cp prefix/$arch/lib/libavfilter.so "$dst" || true
            cp prefix/$arch/lib/libavdevice.so "$dst" || true
            cp prefix/$arch/lib/libpostproc.so "$dst" || true
          done

      - name: Build release AAR
        run: ./gradlew library:assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-native-android-aar
          path: library/build/outputs/aar/library-release.aar

      - name: Release AAR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: library/build/outputs/aar/library-release.aar
